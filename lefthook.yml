pre-commit:
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs,json}"
      run: pnpm exec biome check --write --unsafe --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck

commit-msg:
  commands:
    validate-commit-msg:
      run: node scripts/validate-commit-msg.mjs {1}
