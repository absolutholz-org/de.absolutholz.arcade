name: Deploy Arcade Monorepo to Webgo

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY || secrets.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID || secrets.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID || secrets.PUBLIC_FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Verification (Quality Gate)
        run: |
          pnpm check
          pnpm typecheck

      - name: Build Hub
        run: pnpm build:hub

      - name: Build Sudoku
        run: pnpm build:sudoku

      - name: Build Minesweeper
        run: pnpm build:minesweeper

      - name: Build Nonogram
        run: pnpm build:nonogram

      - name: Build Queens
        run: pnpm build:queens

      - name: Build Bridges
        run: pnpm build:bridges

      - name: Build Tracks
        run: pnpm build:tracks

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Assemble deployment payload
        run: |
          mkdir -p deploy_dist
          # 1. Copy Hub to document root
          cp -R apps/hub/dist/. deploy_dist/
          # 2. Copy Sudoku into /sudoku subpath
          mkdir -p deploy_dist/sudoku
          cp -R apps/sudoku/dist/. deploy_dist/sudoku/
          # 3. Copy Minesweeper into /minesweeper subpath
          mkdir -p deploy_dist/minesweeper
          cp -R apps/minesweeper/dist/. deploy_dist/minesweeper/
          # 4. Copy Nonogram into /nonogram subpath
          mkdir -p deploy_dist/nonogram
          cp -R apps/nonogram/dist/. deploy_dist/nonogram/
          # 5. Copy Queens into /queens subpath
          mkdir -p deploy_dist/queens
          cp -R apps/queens/dist/. deploy_dist/queens/
          # 6. Copy Bridges into /bridges subpath
          mkdir -p deploy_dist/bridges
          cp -R apps/bridges/dist/. deploy_dist/bridges/
          # 7. Copy Tracks into /tracks subpath
          mkdir -p deploy_dist/tracks
          cp -R apps/tracks/dist/. deploy_dist/tracks/
          # 8. Copy Storybook into /storybook subpath
          mkdir -p deploy_dist/storybook
          cp -R libraries/ui/storybook-static/. deploy_dist/storybook/
          # 9. Copy Apache production .htaccess
          cp deploy/.htaccess deploy_dist/.htaccess

      - name: Deploy via SSH & rsync to Webgo
        run: |
          # Create SSH directory and configure private key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Scan and store host key to prevent interactive verification prompt
          ssh-keyscan -p ${{ secrets.WEBGO_SFTP_PORT || 22 }} ${{ secrets.WEBGO_SFTP_HOST }} >> ~/.ssh/known_hosts

          # Ensure target directory exists on Webgo
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.WEBGO_SFTP_PORT || 22 }} ${{ secrets.WEBGO_SFTP_USERNAME }}@${{ secrets.WEBGO_SFTP_HOST }} \
            "mkdir -p /home/www/de.absolutholz.arcade"

          # Rsync assembled payload atomically
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.WEBGO_SFTP_PORT || 22 }}" \
            deploy_dist/ ${{ secrets.WEBGO_SFTP_USERNAME }}@${{ secrets.WEBGO_SFTP_HOST }}:/home/www/de.absolutholz.arcade/

          # Set directory and file permissions
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.WEBGO_SFTP_PORT || 22 }} ${{ secrets.WEBGO_SFTP_USERNAME }}@${{ secrets.WEBGO_SFTP_HOST }} \
            "find /home/www/de.absolutholz.arcade -type d -exec chmod 755 {} \; && find /home/www/de.absolutholz.arcade -type f -exec chmod 644 {} \;"

          # Clean up private key
          rm ~/.ssh/id_rsa
